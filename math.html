<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math.js Expression Calculator</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.5.0/math.min.js"></script>
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm p-4">
        <h3 class="mb-4">Math.js Expression Evaluator</h3>

        <div class="mb-3">
            <label class="form-label">Expression (string)</label>
            <input id="expression" type="text" class="form-control"
                   value="a + b + c" />
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">a</label>
                <input id="a" type="number" class="form-control" value="1"/>
            </div>
            <div class="col">
                <label class="form-label">b</label>
                <input id="b" type="number" class="form-control" value="2"/>
            </div>
            <div class="col">
                <label class="form-label">c</label>
                <input id="c" type="number" class="form-control" value="3"/>
            </div>
        </div>

        <button class="btn btn-primary" onclick="calculate()">Calculate</button>

        <h4 class="mt-4">Result: <span id="result">—</span></h4>
    </div>
</div>

<script>
function calculate() {
    const expr = document.getElementById("expression").value;

    const scope = {
        a: Number(document.getElementById("a").value),
        b: Number(document.getElementById("b").value),
        c: Number(document.getElementById("c").value)
    };

    try {
        const result = math.evaluate(expr, scope);
        document.getElementById("result").textContent = result;
    } catch (err) {
        document.getElementById("result").textContent = "Invalid expression!";
    }
}
</script>

</body>
</html>
